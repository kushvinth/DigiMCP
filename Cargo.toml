[package]
name = "digimcp"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
default-run = "digi"
description = "What's due, attendance, grades, materials, and agentic submissions — MCP server for Digiicampus (CollPoll) student portals."
license = "MIT"
repository = "https://github.com/kushvinth/DigiMCP"
homepage = "https://github.com/kushvinth/DigiMCP"
documentation = "https://github.com/kushvinth/DigiMCP#readme"
keywords = ["mcp", "college", "student", "attendance", "grades"]
categories = ["command-line-utilities"]
exclude = [
    "assets/*",
    "scripts/*",
    ".agents/*",
    ".github/*",
    "examples/*",
    "Formula/*",
    ".claude-plugin/*",
    ".codex-plugin/*",
]

[[bin]]
name = "digi"
path = "src/main.rs"

[[bin]]
name = "digimcp"
path = "src/bin/digimcp.rs"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmcp = { version = "3", default-features = false, features = ["server", "transport-io"] }
schemars = { version = "1", default-features = false, features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
incremental = false
overflow-checks = false
