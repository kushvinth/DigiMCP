[package]
name = "quad-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "What's due, attendance, grades, and agentic submissions — MCP server for a Digiicampus (CollPoll) student portal."
license = "MIT"
repository = "https://github.com/kushvinth/quad"
homepage = "https://github.com/kushvinth/quad"
documentation = "https://github.com/kushvinth/quad#readme"
keywords = ["mcp", "college", "student", "attendance", "grades"]
categories = ["command-line-utilities"]
exclude = ["target/*", ".github/*", "examples/*"]

[[bin]]
name = "quad"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = { version = "0.10", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "brotli", "deflate"] }
rmcp = { version = "3", default-features = false, features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
