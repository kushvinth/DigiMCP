name: Release & Multi-Provider Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_mcp_only:
        description: "Only validate and publish server.json to the MCP Registry"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  validate:
    name: Validate Manifests & Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Validate all provider manifests
        run: ./scripts/validate-manifests.sh

      - name: Run clippy and test suite
        run: |
          cargo clippy --all-targets
          cargo test --all-targets

  publish-cargo:
    name: Publish to Crates.io
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-linux-x86_64:
    name: Build Linux x86_64
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || !inputs.publish_mcp_only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build release binaries
        run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Archive binaries
        run: |
          mkdir -p dist
          ln -sf digi target/x86_64-unknown-linux-gnu/release/digii
          tar -czf dist/digimcp-linux-x86_64.tar.gz -C target/x86_64-unknown-linux-gnu/release digi digii digimcp
      - uses: actions/upload-artifact@v4
        with:
          name: digimcp-linux-x86_64
          path: dist/digimcp-linux-x86_64.tar.gz

  build-linux-arm64:
    name: Build Linux aarch64
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || !inputs.publish_mcp_only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install aarch64 cross-linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build release binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu
      - name: Archive binaries
        run: |
          mkdir -p dist
          ln -sf digi target/aarch64-unknown-linux-gnu/release/digii
          tar -czf dist/digimcp-linux-aarch64.tar.gz -C target/aarch64-unknown-linux-gnu/release digi digii digimcp
      - uses: actions/upload-artifact@v4
        with:
          name: digimcp-linux-aarch64
          path: dist/digimcp-linux-aarch64.tar.gz

  build-macos-universal:
    name: Build macOS Universal (x86_64 + arm64)
    needs: validate
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') || !inputs.publish_mcp_only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - name: Build both architectures
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
      - name: Create Universal Binaries with lipo
        run: |
          mkdir -p dist target/universal
          for b in digi digimcp; do
            lipo -create -output target/universal/$b \
              target/x86_64-apple-darwin/release/$b \
              target/aarch64-apple-darwin/release/$b
          done
          ln -sf digi target/universal/digii
          tar -czf dist/digimcp-macos-universal.tar.gz -C target/universal digi digii digimcp
      - uses: actions/upload-artifact@v4
        with:
          name: digimcp-macos-universal
          path: dist/digimcp-macos-universal.tar.gz

  build-windows:
    name: Build Windows x86_64
    needs: validate
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || !inputs.publish_mcp_only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binaries
        run: cargo build --release
      - name: Archive binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\release\digi.exe target\release\digii.exe
          Compress-Archive -Path target\release\digi.exe,target\release\digii.exe,target\release\digimcp.exe -DestinationPath dist\digimcp-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: digimcp-windows-x86_64
          path: dist/digimcp-windows-x86_64.zip

  package-plugins:
    name: Package Provider Plugins & Extensions
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || !inputs.publish_mcp_only
    steps:
      - uses: actions/checkout@v4
      - name: Package Claude Code, Codex, Gemini, and MCP bundles
        run: |
          mkdir -p dist/packages

          # 1. Claude Code Plugin (.claude-plugin/, skills/, .mcp.json)
          zip -r dist/packages/digimcp-claude-plugin.zip .claude-plugin skills .mcp.json README.md LICENSE

          # 2. Codex Plugin (.codex-plugin/, skills/)
          zip -r dist/packages/digimcp-codex-plugin.zip .codex-plugin skills README.md LICENSE

          # 3. Gemini CLI Extension (gemini-extension.json, AGENTS.md, skills/)
          zip -r dist/packages/digimcp-gemini-extension.zip gemini-extension.json AGENTS.md skills README.md LICENSE

          # 4. Standard MCP Registry Package (server.json, plugin.yaml, .mcp.json)
          zip -r dist/packages/digimcp-mcp-bundle.zip server.json plugin.yaml .mcp.json README.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-packages
          path: dist/packages/*.zip

  github-release:
    name: Create GitHub Release & Upload Assets
    needs:
      - build-linux-x86_64
      - build-linux-arm64
      - build-macos-universal
      - build-windows
      - package-plugins
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute SHA256 checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          echo "Release Assets & Checksums:"
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

  mcp-registry:
    name: Publish to MCP Registry
    needs: [validate, publish-cargo]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.validate.result == 'success' &&
      ((startsWith(github.ref, 'refs/tags/v') && needs.publish-cargo.result == 'success') || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/arm64/arm64/;s/x86_64/amd64/').tar.gz" \
            | tar -xz mcp-publisher
      - name: Validate and publish server.json to MCP Registry
        run: |
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
